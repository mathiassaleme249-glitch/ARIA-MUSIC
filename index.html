
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10101d">
<title>ARIA MUSIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101d;color:#f5f3ff;font-family:Arial,sans-serif}
header{padding:20px;background:#19172b;border-bottom:1px solid #38304f;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:23px;font-weight:bold;color:#c6a5ff}
.logo span{color:#70e5e0}
button{border:0;border-radius:12px;padding:12px;background:#7651bd;color:white;font-size:15px;cursor:pointer}
.layout{display:flex;height:calc(100dvh - 75px)}
aside{width:245px;background:#171526;padding:15px;border-right:1px solid #38304f}
aside button{width:100%;margin-bottom:15px}
#chats{display:flex;flex-direction:column;gap:7px}
.chat-item{background:#25223a;color:white;text-align:left;overflow:hidden;text-overflow:ellipsis}
.chat-item.active{background:#49366e}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.welcome{text-align:center;margin:auto;padding:20px}
.symbol{font-size:55px}
.welcome h1{font-size:30px;color:#c6a5ff}
.welcome p{color:#aaa5bd;line-height:1.6}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.message{padding:13px 16px;border-radius:16px;max-width:85%;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#6848a6}
.aria{align-self:flex-start;background:#242239;border:1px solid #48405f}
.composer{padding:14px;display:flex;gap:9px;background:#19172b;border-top:1px solid #38304f}
textarea{flex:1;min-width:0;resize:none;border-radius:13px;border:1px solid #51466b;background:#242239;color:white;padding:13px;font:inherit;max-height:110px}
#send{align-self:flex-end}
footer{text-align:center;color:#88839c;font-size:11px;padding:8px}
@media(max-width:600px){
 aside{width:105px;padding:9px}
 aside button{font-size:12px;padding:10px 4px}
 .chat-item{font-size:11px;padding:9px 5px}
 #messages{padding:12px}
 .composer{padding:9px}
}
</style>
</head>
<body>
<header>
 <div class="logo">♫ ARIA <span>MUSIC</span></div>
 <button onclick="newChat()">+ Nuevo chat</button>
</header>
<div class="layout">
 <aside>
  <button onclick="newChat()">＋ Crear chat</button>
  <p>HISTORIAL</p>
  <div id="chats"></div>
 </aside>
 <main>
  <div id="messages"></div>
  <div class="composer">
   <textarea id="input" rows="1" placeholder="Escribe a ARIA..."></textarea>
   <button id="send" onclick="sendMessage()">➤</button>
  </div>
  <footer>ARIA MUSIC · Primera versión de prueba</footer>
 </main>
</div>
<script>
let historyData=JSON.parse(localStorage.getItem("aria_chats")||"[]");
let current=null;

function save(){
 localStorage.setItem("aria_chats",JSON.stringify(historyData));
 renderChats();
}
function newChat(){
 let id=Date.now();
 historyData.unshift({id,title:"Nuevo chat",messages:[]});
 current=id;
 save();
 renderMessages();
}
function renderChats(){
 let box=document.getElementById("chats");
 box.innerHTML="";
 historyData.forEach(c=>{
  let b=document.createElement("button");
  b.className="chat-item"+(c.id===current?" active":"");
  b.textContent=c.title;
  b.onclick=()=>{current=c.id;renderChats();renderMessages()};
  box.appendChild(b);
 });
}
function renderMessages(){
 let box=document.getElementById("messages");
 box.innerHTML="";
 let chat=historyData.find(c=>c.id===current);
 if(!chat||chat.messages.length===0){
  box.innerHTML='<div class="welcome"><div class="symbol">♫</div><h1>Hola, soy ARIA</h1><p>Tu espacio creativo para la música.<br>Podemos preparar canciones, letras e ideas musicales.</p></div>';
  return;
 }
 chat.messages.forEach(m=>{
  let d=document.createElement("div");
  d.className="message "+(m.role==="user"?"user":"aria");
  d.textContent=m.text;
  box.appendChild(d);
 });
 box.scrollTop=box.scrollHeight;
}
function sendMessage(){
 let input=document.getElementById("input");
 let value=input.value.trim();
 if(!value)return;
 if(!current)newChat();
 let chat=historyData.find(c=>c.id===current);
 chat.messages.push({role:"user",text:value});
 if(chat.title==="Nuevo chat")chat.title=value.slice(0,25);
 chat.messages.push({role:"aria",text:"¡He recibido tu mensaje! 🎵\n\nEsta es la primera versión de ARIA MUSIC. Todavía no tengo conectado un motor de inteligencia artificial, pero ya podemos probar la interfaz y guardar nuestras conversaciones en este dispositivo."});
 input.value="";
 save();
 renderMessages();
}
document.getElementById("input").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
});
if(historyData.length){current=historyData[0].id}
else newChat();
renderChats();
renderMessages();
</script>
</body>
  </html>
